body { margin:0; font-family:Arial,Helvetica,sans-serif; color: #212121; }
button,select {font:inherit;}
button {border:0; background:none; color:inherit; padding:0;}
a {color:inherit; text-decoration:none;}
h1,h2,h3,p {margin:0;}
[hidden] {display:none !important;}
* { box-sizing: border-box; }
body { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid #1786ab; outline-offset: 3px; }
.directory { height: 100dvh; min-height: 480px; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
.brand-header { min-height: 88px; display: flex; align-items: center; padding: 0 32px 0 0; background: #212121; color: #FFFFFF; gap: 30px; }
.logo-panel { align-self: stretch; width: 242px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: white; border-bottom: 1px solid #e0e9ee; }
.brand-logo { width: 180px; height: auto; }
.header-title span { display: block; text-transform: uppercase; font-size: 12px; letter-spacing: .17em; color: #00f584; margin-bottom: 5px; font-weight: 600; }
.header-title h1 { font-size: 21px; font-weight: 400; letter-spacing: -.025em; line-height: 1.25; margin: 0; color: #FFFFFF;}
.header-world { display: flex; gap: 9px; align-items: center; margin-left: auto; color: #FFFFFF; font-size: 13px; }
.filter-bar { display: flex; gap: 24px; align-items: center; padding: 20px 28px; border-bottom: 1px solid #dbe5eb; background: #fff; z-index: 2; }
.filter-intro { width: 268px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; color: #212121; }
.filter-field { width: 240px; max-width: 30%; }
.filter-field label { display: block; margin-bottom: 6px; font-size: 12px; color: #212121; font-weight: 600; }
.filter-select { width: 100%; min-height: 42px; border-radius: 5px; border-color: #cbdbe3; box-shadow: none; font-size: 14px; }
.reset-button { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #212121; font-size: 14px; padding: 10px 0 10px 10px; white-space: nowrap; }
.reset-button:hover { text-decoration: underline; }
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
.expert-panel { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #dbe5eb; z-index: 1; background: white; }
.list-heading { padding: 23px 22px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5edf1; color: #212121; }
.list-heading h2 { display: flex; align-items: center; gap: 9px; color: #212121; font-size: 17px; font-weight: 600; margin: 0; }
.count { background: #eef4f7; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.list-heading p { font-size: 12px; margin: 6px 0 0; color: #212121; }
.expert-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #c8d7df transparent; }
.expert-card { padding: 20px 19px 18px; border-bottom: 1px solid #e5edf1; border-left: 3px solid transparent; transition: background .15s; }
.expert-card:hover { background: #f7fafb; }
.expert-card.selected { background: #eef7fa; border-left-color: #007e9f; }
.profile-button { display: block; width: 100%; text-align: left; }
.profile-top { display: flex; align-items: flex-start; gap: 10px; }
.expert-initials { flex-shrink: 0; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #eaf2f6; color: #212121; font-size: 12px; font-weight: 600; }
.expert-initials { overflow: hidden; }
.expert-initials img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.profile-name { flex: 1; min-width: 0; }
.profile-name strong { display: block; font-size: 15px; line-height: 1.3; font-weight: 600; }
.profile-name > span { display: block; font-size: 12px; color: #212121; margin-top: 4px; line-height: 1.45; }
.profile-arrow { color: #212121; margin-top: 2px; flex-shrink: 0; }
.location { display: flex; align-items: center; gap: 5px; margin-top: 13px; font-size: 12px; color: #212121; }

function validateProfiles(entries) {
  const ids = new Set();
  return Object.entries(entries).map(([file, value]) => {
    const fail = (message) => { throw new Error(`${file}: ${message}`); };
    if (!value || typeof value !== "object" || Array.isArray(value)) return fail("expected a profile object");
    const p = value;
    for (const field of ["id", "name", "role", "region", "city", "country"]) {
      if (typeof p[field] !== "string" || !p[field].trim()) fail(`${field} must be a nonempty string`);
    }
    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(p.id)) fail("id must be a lowercase hyphenated identifier");
    if (ids.has(p.id)) fail(`duplicate id: ${p.id}`);
    ids.add(p.id);
    if (!Array.isArray(p.expertise) || !p.expertise.length || p.expertise.some(x => typeof x !== "string" || !x.trim())) fail("expertise must be a nonempty array of strings");
    for (const [key, limit] of [["latitude", 90], ["longitude", 180]]) {
      if (typeof p[key] !== "number" || !Number.isFinite(p[key]) || Math.abs(p[key]) > limit) fail(`${key} must be a number between -${limit} and ${limit}`);
    }
    if (p.email !== undefined && (typeof p.email !== "string" || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))) fail("email must be a valid email address");
    if (p.phone !== undefined && (typeof p.phone !== "string" || !/^\+?[\d\s().-]+$/.test(p.phone) || !/\d/.test(p.phone))) fail("phone must be a telephone number");
    if (p.imagePath !== undefined && (typeof p.imagePath !== 'string' || !new RegExp(`^images/profiles/${p.id}\\.(?:jpg|png|webp)$`).test(p.imagePath))) fail('imagePath must be a local images/profiles/<id>.jpg, .png or .webp path');
    return p;
  }).sort((a, b) => a.name.localeCompare(b.name, "en"));
}
function filterExperts(experts, expertise, region) {
  return experts.filter(p => (expertise === "all" || p.expertise.includes(expertise)) && (region === "all" || p.region === region));
}
function inBounds(expert, bounds) {
  if (expert.latitude < bounds.south || expert.latitude > bounds.north) return false;
  let width = bounds.east - bounds.west;
  if (Math.abs(width) >= 360) return true;
  if (width < 0) width += 360;
  const offset = ((expert.longitude - bounds.west) % 360 + 360) % 360;
  return offset <= width;
}
// Smallest longitude span, including data crossing the date line.
function fitExtent(experts) {
  if (!experts.length) return null;
  const xs = experts.map(p => (p.longitude + 360) % 360).sort((a, b) => a - b);
  let largest = -1, start = 0;
  xs.forEach((x, i) => {
    const next = i === xs.length - 1 ? xs[0] + 360 : xs[i + 1];
    if (next - x > largest) { largest = next - x; start = next % 360; }
  });
  const west = start > 180 ? start - 360 : start;
  return [[west, Math.min(...experts.map(p => p.latitude))], [west + 360 - largest, Math.max(...experts.map(p => p.latitude))]];
}

function node(tag, className, text) {
  const result = document.createElement(tag);
  result.className = className;
  if (text !== undefined) result.textContent = text;
  return result;
}

function createPortrait(profile, className, size, tag = 'div') {
  const initials = profile.name.trim().split(/\s+/).map(part => part[0]).slice(0, 3).join('');
  const portrait = node(tag, className);
  portrait.setAttribute('aria-hidden', 'true');
  if (profile.imagePath) {
    const image = node('img', '');
    image.alt = '';
    image.width = image.height = size;
    image.addEventListener('error', () => portrait.replaceChildren(initials), {once: true});
    image.src = embeddedImages[profile.imagePath];
    portrait.append(image);
  } else portrait.textContent = initials;
  return portrait;
}

function createProfileCard(profile) {
  const card = node('section', 'map-profile');
  card.setAttribute('aria-label', `${profile.name} profile`);
  const header = node('div', 'map-profile-header');
  const portrait = createPortrait(profile, 'map-profile-portrait', 88);
  const heading = node('div', 'map-profile-heading');
  heading.append(node('h2', '', profile.name), node('p', '', profile.role));
  header.append(portrait, heading);
  const details = node('dl', 'map-profile-details');
  const location = profile.city.trim().toLowerCase() === 'not published' ? profile.country : `${profile.city}, ${profile.country}`;
  for (const [label, value, href] of [
    ['Expertise', profile.expertise.join(', ')],
    ['Location', location],
    ['Email', profile.email, `mailto:${profile.email}`],
    ['Phone', profile.phone, `tel:${profile.phone?.replace(/[^+\d]/g, '')}`],
    ['Website', profile.sourceUrl && 'View Sedgwick profile', profile.sourceUrl]
  ]) {
    if (!value) continue;
    const description = node('dd', '');
    if (href) {
      const link = node('a', '', value); link.href = href; description.append(link);
    } else description.textContent = value;
    details.append(node('dt', '', label), description);
  }
  card.append(header, details);
  return card;
}

  if(!profilePopup)return;
  const container=$('map');
  profilePopup.setMaxWidth(`${Math.min(360,container.clientWidth-32)}px`);
  profilePopup.getElement().style.setProperty('--profile-max-height',`${Math.max(100,container.clientHeight*.75-76)}px`);
}
document.addEventListener('keydown',event=>{
  if(event.key==='Escape' && profilePopup) {closeProfile();focusSelected();}
});
function fitMap(animate=true) {
  if(!ready || !available) return;
  const extent=world() ? [[-180,-58],[180,78]] : fitExtent(filtered);
  if(extent) map.fitBounds(extent,{padding:innerWidth<700?24:48,maxZoom:9,duration:animate?duration:0});
}
function applyFilters() {
  closeProfile();
  selected=null; filtered=filterExperts(experts,$('expertise').value,$('region').value);
  if(ready) map.getSource('experts').setData(geojson(filtered));
  renderList();fitMap();
}
function resetFilters() { $('expertise').value='all';$('region').value='all';applyFilters(); }
function unavailable(message) {
  closeProfile();
  available=false;$('map-caption').hidden=true;$('map-status').hidden=false;
  $('map-message').textContent=message;renderList();
}
async function start() {
  try {
    experts=validateProfiles(embeddedProfiles);filtered=experts;
    for(const [id,values] of [['expertise',experts.flatMap(p=>p.expertise)],['region',experts.map(p=>p.region)]]) {
      for(const value of [...new Set(values)].sort()) $(id).add(new Option(value,value));
      $(id).disabled=false;$(id).addEventListener('change',applyFilters);
    }
    $('reset').addEventListener('click',resetFilters);renderList();
  } catch(error) {
    $('list-description').textContent='Expert profiles could not be loaded.';
    $('expert-list').append(element('p','empty-state','Please check the profile files and reload the page.'));
    $('map-caption').textContent='Expert data unavailable';console.error(error);return;
  }
  let token=config.mapboxToken;
  if(!token) { unavailable('The map needs a Mapbox access token. You can still browse experts using the list and filters.');return; }
  if(!window.mapboxgl) { unavailable('The map could not load. You can still browse experts using the list and filters.');return; }
  try { initializeMap(token); } catch(error) { console.error(error);unavailable('The map is unavailable. You can still browse experts using the list and filters.'); }
}
function initializeMap(token) {
  // Chromium rejects module blob workers from file:// documents. The pinned
  // Mapbox UMD bundle also runs as a classic worker; use its public workerClass
  // hook for local files, preserving normal worker behavior on hosted pages.
  if (location.protocol === 'file:') {
    mapboxgl.workerClass = class extends Worker {
      constructor() {
        super(mapboxgl.workerUrl, {type: 'classic', name: 'Mapbox local-file worker'});
      }
    };
  }
  // At zoom 0 the equirectangular world is 512px wide. Keep the
  // latitude span from 85°S to 85°N tall enough to fill the viewport.
  const minimumZoom = () => Math.max(-2, Math.log2(Math.max(1,$('map').clientHeight) / (512 * 170 / 360)));
  map=new mapboxgl.Map({container:'map',accessToken:token,style:'mapbox://styles/mapbox/light-v11',projection:'equirectangular',center:[8,15],zoom:.5,minZoom:minimumZoom(),maxZoom:19,maxBounds:[[-180,-85],[180,85]],renderWorldCopies:false});
  map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'bottom-right');map.dragRotate.disable();map.touchZoomRotate.disableRotation();
  map.on('moveend',()=>{if(ready)renderList();});
  const fail=()=>unavailable('The map is unavailable. You can still browse experts using the list and filters.');
  const timeout=setTimeout(fail,25000);
  map.on('error',event=>{if(!map.isStyleLoaded()||/401|403|token|unauthorized/i.test(event.error.message))fail();});
  map.on('load',()=>{
    clearTimeout(timeout);
    if(map.getLayer('water'))map.setPaintProperty('water','fill-color','#b9dbe9');
    if(map.getLayer('background'))map.setPaintProperty('background','background-color','#f1f4f2');
    // The light basemap uses dark Sedgwick text for every geographic label.
    for (const layer of map.getStyle().layers) {
      if (layer.type === 'symbol' && layer.layout?.['text-field']) {
        map.setPaintProperty(layer.id, 'text-color', '#212121');
      }
    }
    map.addSource('experts',{type:'geojson',data:geojson(filtered),cluster:true,clusterRadius:42,clusterMaxZoom:16});
    map.addLayer({id:'clusters',type:'circle',source:'experts',filter:['has','point_count'],paint:{'circle-color':'#212121','circle-radius':['step',['get','point_count'],20,10,25],'circle-stroke-width':3,'circle-stroke-color':'#fff'}});
    map.addLayer({id:'cluster-count',type:'symbol',source:'experts',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-font':['DIN Offc Pro Medium','Arial Unicode MS Bold'],'text-size':14},paint:{'text-color':'#FFFFFF'}});
    map.addLayer({id:'points',type:'circle',source:'experts',filter:['!',['has','point_count']],paint:{'circle-color':'#212121','circle-radius':7,'circle-stroke-width':2,'circle-stroke-color':'#fff'}});
    map.addSource('selection',{type:'geojson',data:geojson([])});
    map.addLayer({id:'selection-ring',type:'circle',source:'selection',paint:{'circle-radius':14,'circle-color':'#0b4764','circle-opacity':.15,'circle-stroke-width':3,'circle-stroke-color':'#082f49'}});
    map.on('click','clusters',async event=>{
      const feature=event.features?.[0];if(!feature)return;
      const source=map.getSource('experts'),profiles=filtered,id=Number(feature.properties.cluster_id);
      try {
        const leaves=await new Promise((resolve,reject)=>source.getClusterLeaves(id,Number(feature.properties.point_count),0,(err,result)=>err?reject(err):resolve(result??[])));
        const ids=new Set(leaves.map(p=>p.properties.id));
        const extent=fitExtent(profiles.filter(p=>ids.has(p.id)));
        const zoom=await new Promise((resolve,reject)=>source.getClusterExpansionZoom(id,(err,result)=>err?reject(err):resolve(result??18)));
        if(profiles===filtered&&extent)map.fitBounds(extent,{padding:48,maxZoom:Math.min(zoom,19),duration});
      } catch { /* A filter change can invalidate the clicked cluster. */ }
    });
    map.on('click','points',event=>{
      const clicked=filtered.find(p=>p.id===event.features?.[0]?.properties.id);if(!clicked)return;
      const colocated=filtered.filter(p=>p.longitude===clicked.longitude&&p.latitude===clicked.latitude);
      const index=colocated.findIndex(p=>p.id===selected);selectExpert(colocated[(index+1)%colocated.length].id,true);
    });
    for(const layer of ['clusters','points']) {
      map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',layer,()=>map.getCanvas().style.cursor='');
    }
    ready=true;available=true;$('map-status').hidden=true;$('map-caption').hidden=true;fitMap(false);renderList();
  });
  new ResizeObserver(()=>{
    map.setMinZoom(minimumZoom());
    map.resize();sizeProfile();
    const p=profilePopup && filtered.find(p=>p.id===selected);
    if(p) map.easeTo({center:[p.longitude,p.latitude],offset:profileOffset(),duration:0});
    else fitMap(false);
    if(ready)renderList();
  }).observe($('map'));
}
// Start after the deferred Mapbox script has either loaded or failed.
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();

})();
</script>
